<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Viewer</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 14l4-4"/>
              <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
            </svg>
          </span>
          <div class="brand-text">
            <h1>Context Viewer</h1>
            <span id="version-badge" class="pill pill-muted">v0.9.2-1</span>
            <span id="mode-pill" class="pill pill-muted">连接中…</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="btn-hot-inject" type="button" class="btn btn-secondary btn-xs" hidden title="立即热注入顶栏">热注入</button>
          <button id="btn-auto" type="button" class="btn btn-ghost btn-xs active" title="每 25 秒自动同步会话与连接状态">自动 25s</button>
          <button id="btn-lang" type="button" class="btn btn-ghost btn-xs" title="Switch language / 切换语言">EN</button>
          <button id="btn-refresh" type="button" class="icon-btn" title="强制刷新全部数据">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
              <polyline points="21 3 21 9 15 9"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="conv-bar">
        <label class="conv-label" for="conv-select" id="lbl-conv">会话:</label>
        <select id="conv-select" class="select-input" aria-label="选择会话">
          <option value="">自动探测当前会话…</option>
        </select>
      </div>

      <nav class="tabs" role="tablist" aria-label="视图切换">
        <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="context" id="tab-context">
          <span class="tab-label" id="lbl-tab-context">上下文 &amp; 详情</span>
          <span class="tab-pill" id="pill-tab-context">--%</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="quota" id="tab-quota">
          <span class="tab-label" id="lbl-tab-quota">配额 &amp; 账号</span>
          <span class="tab-pill" id="pill-tab-quota">--</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="tokens" id="tab-tokens">
          <span class="tab-label" id="lbl-tab-tokens">Token &amp; 费用</span>
          <span class="tab-pill" id="pill-tab-tokens">--</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="diagnostics" id="tab-diagnostics">
          <span class="tab-label" id="lbl-tab-diagnostics">诊断</span>
        </button>
      </nav>
    </header>

    <main id="content" class="content">
      <section id="panel-embed" class="panel embed-panel active">
        <div id="ag-sidecar-aux-host" class="ag-sidecar-aux-host" data-aux-pane-focus-scope="true" data-side-panel-open="true">
          <div id="embed-loading" class="embed-loading">正在加载完整仪表盘…</div>
        </div>
      </section>
      <section id="panel-diagnostics" class="panel diag-panel"></section>
    </main>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
