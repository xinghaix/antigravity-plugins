name: Sync Upstream Mattpocock Skills

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync mattpocock/skills & Open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync and compile upstream skills
        run: |
          npm run sync:mattpocock -- --preserve
          npm run sync:registry
          npm run check
          npm test

      - name: Check for changes and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          BRANCH="chore/sync-mattpocock-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(mattpocock-skills): sync upstream mattpocock/skills"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(mattpocock-skills): sync upstream mattpocock/skills" \
            --body "Automated upstream sync from \`mattpocock/skills\`. Local \`npm run check\` and \`npm test\` passed." \
            --base main \
            --head "$BRANCH"
