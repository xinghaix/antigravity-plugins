name: Release

on:
  push:
    tags:
      - "*-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Single plugin ID to package (leave empty for full monorepo release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run checks and tests
        run: |
          npm run check
          npm test

      - name: Package release archives
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.plugin }}" ]; then
            npm run pack:release -- --plugin "${{ inputs.plugin }}"
          else
            npm run pack:release
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release/RELEASE_BODY.md
          files: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
